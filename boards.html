<!doctype html>
<html lang="ko" data-kr-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X5 화면 나란히</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="tokens.css">
<style>
body{margin:0;background:var(--kr-bg);color:var(--kr-ink);font-family:var(--kr-font-ui);font-size:12px}
header{display:flex;gap:14px;align-items:center;padding:14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--kr-line);position:sticky;top:0;background:var(--kr-bg);z-index:2;flex-wrap:wrap}
header b{font-size:15px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--kr-line);border-radius:4px;overflow:hidden}
.seg button{height:26px;padding:0 10px;border:0;background:none;color:var(--kr-sub);font:inherit;cursor:pointer}
.seg button.on{background:var(--kr-panel2);color:var(--kr-ink)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(372px,1fr));gap:18px;padding:18px max(16px,env(safe-area-inset-left,0px))}
.b{display:flex;flex-direction:column;gap:6px;min-width:0}
.b .f{position:relative;width:100%;aspect-ratio:1440/900;overflow:hidden;border:1px solid var(--kr-line);background:var(--kr-canvas)}
.b iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.b a{color:var(--kr-sub);text-decoration:none;display:flex;justify-content:space-between}
.b a:hover{color:var(--kr-ink)}
.mute{color:var(--kr-mute)}
</style>
</head>
<body>
<header><b>X5 화면 나란히</b><span class="mute">각 칸은 작동 시안을 그 장면으로 연 것(축소). 누르면 그 화면이 새 탭에서 작동 상태로 열림</span><span class="seg" id="th"><button data-t="dark" class="on">어둡게</button><button data-t="light">밝게</button><button data-t="indigo">인디고</button><button data-t="all">세 테마</button></span></header>
<div class="g" id="g"></div>
<script>
var SC=[['search','검색 기본'],['sel','선택 상태 · 토글'],['wide','조건 칸 접힘'],['cond','조건 창'],['imgfind','사진으로 찾기'],['reel','필름 릴'],['photos','사진 창 간단히'],['photod','사진 창 상세히'],['cmp','비교함 나란히'],['tl','타임라인 크게'],['fav','즐겨찾기 + F2'],['work','작품 페이지'],['person','사람 페이지'],['keys','단축키'],['ai','단계 분석 실행']];
var cur='dark';
function draw(){var g=document.getElementById('g'),ths=cur==='all'?['dark','light','indigo']:[cur],h='';
 SC.forEach(function(s){ths.forEach(function(t){var u='app.html?embed=1&scene='+s[0]+'&theme='+t;h+='<div class="b"><div class="f"><iframe data-src="'+u+'" title="'+s[1]+' '+t+'" loading="lazy" tabindex="-1"></iframe></div><a href="app.html?scene='+s[0]+'&theme='+t+'" target="_blank" rel="noopener"><span>'+s[1]+'</span><span class="mute">'+t+' ↗</span></a></div>';});});
 g.innerHTML=h;fit();var io=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){var f=e.target;if(!f.src)f.src=f.getAttribute('data-src');io.unobserve(f);}});},{rootMargin:'200px'});
 Array.prototype.forEach.call(document.querySelectorAll('iframe'),function(f){io.observe(f);});}
function fit(){Array.prototype.forEach.call(document.querySelectorAll('.b .f'),function(f){var w=f.clientWidth;f.firstChild.style.transform='scale('+(w/1440)+')';});}
document.getElementById('th').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cur=b.getAttribute('data-t');Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});document.documentElement.setAttribute('data-kr-theme',cur==='all'?'dark':cur);draw();});
addEventListener('resize',fit);draw();
</script>
</body>
</html>
